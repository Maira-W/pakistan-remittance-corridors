[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remit"
version = "1.0.0"
description = "Pakistan remittance corridors: where the money comes from and when it arrives"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "statsmodels>=0.14", "matplotlib>=3.9", "plotly>=5.24", "openpyxl>=3.1", "pypdfium2>=4.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
remit = "remit.__main__:main"

[tool.setuptools.packages.find]
include = ["remit*"]

[tool.setuptools.package-data]
remit = ["templates/*", "templates/docs/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]            # the package sits at the repository root, so plain `pytest` can import it without an install
filterwarnings = ["ignore::FutureWarning", "ignore::RuntimeWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]
